[package]
name = "brutalist-player"
version = "0.1.0"
description = "Brutalist music player with MilkDrop visualizer"
authors = ["Bryan"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "brutalist_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror = "2"
lofty = "0.22"
walkdir = "2"
which = "7"
tokio = { version = "1", features = ["process", "io-util"] }
# rustls-tls evita la dep transitive de OpenSSL (cross-platform headache).
# json activa `.json()` deserialize en Response. Sin gzip/brotli — LRCLIB
# devuelve plain JSON chico.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# tempfile: dirs efímeros para los JSON in/out de subprocess WhisperX.
tempfile = "3"

